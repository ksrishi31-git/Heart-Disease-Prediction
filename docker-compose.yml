services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heartguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heartguard}
      POSTGRES_DB: ${POSTGRES_DB:-heartguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heartguard} -d ${POSTGRES_DB:-heartguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${PORT:-8000}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-heartguard}:${POSTGRES_PASSWORD:-heartguard}@db:5432/${POSTGRES_DB:-heartguard}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      AUDIT_SALT: ${AUDIT_SALT:-change-me}
      COOKIE_SECURE: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${PORT:-8000}}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5/minute}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-5/minute}
      RATE_LIMIT_PREDICTION: ${RATE_LIMIT_PREDICTION:-30/minute}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
