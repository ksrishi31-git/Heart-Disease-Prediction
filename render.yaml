services:
  - type: web
    name: heartguard-ai
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: PORT
        value: 8000

      - key: COOKIE_SECURE
        value: "true"

      - key: CORS_ORIGINS
        value: ""

      - key: DATABASE_URL
        fromDatabase:
          name: heartguard-db
          property: connectionString

      - key: ENCRYPTION_KEY
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: AUDIT_SALT
        sync: false

databases:
  - name: heartguard-db
    plan: free
    databaseName: heartguard
    user: heartguard